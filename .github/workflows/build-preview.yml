name: Build PHONE LIFE preview
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax
        run: for file in src/*.js; do node --check "$file"; done
      - name: Validate configuration
        run: python scripts/build.py --validate
      - name: Build offline phone
        run: python scripts/build.py
      - name: Commit generated preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html project/index.html BUILD_INFO.json
          if git diff --cached --quiet; then
            echo "Generated preview is already up to date."
          else
            git commit -m "Build customized phone preview"
            git push
          fi
